<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotodog - La Red Social Canina Exclusiva</title>
    
    <!-- Supabase JS Client CDN (AGREGADO Y CORREGIDO) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Design Tokens (Púrpura, Lila, Menta y Coral) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#3b0764',
                            950: '#1e0038',
                        },
                        lilac: {
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                        },
                        mint: {
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        },
                        coral: {
                            400: '#fb7185',
                            500: '#f43f5e',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-100 antialiased selection:bg-brand-500 selection:text-white bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brand-950 via-slate-950 to-black bg-fixed">

    <!-- ==================== MODAL DE AUTENTICACIÓN (LOGIN / REGISTRO) ==================== -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-2xl p-4 overflow-y-auto">
        <div class="bg-slate-900/90 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-brand-500/30 my-auto relative">
            <div class="absolute -top-16 -right-16 w-40 h-40 bg-brand-500/30 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-mint-400/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="p-8 text-center relative z-10">
                <div class="inline-flex p-4 bg-brand-500/10 rounded-3xl mb-3 border border-brand-500/30 shadow-inner">
                    <i data-lucide="dog" class="w-12 h-12 text-mint-400 animate-bounce"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">Fotodog</h1>
                <p class="text-slate-400 text-sm mb-6">La red social canina exclusiva de una publicación al día</p>

                <!-- Pestañas de Login / Registro -->
                <div class="flex bg-slate-950/60 p-1.5 rounded-2xl mb-6 border border-slate-800">
                    <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all bg-brand-600 text-white shadow-lg shadow-brand-600/30">Iniciar Sesión</button>
                    <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-400 hover:text-white">Registrarse</button>
                </div>

                <!-- Formulario de Login -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                        <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="tucorreo@dominio.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
                        <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center space-x-2">
                        <span>Entrar a la Jauría</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <!-- Formulario de Registro -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 text-left hidden">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Nombre del Perro / Mascota</label>
                        <input type="text" id="reg-nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="Ej. Firulais">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Username único (@)</label>
                        <input type="text" id="reg-username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="Ej. @firulais_chile">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Raza</label>
                        <input type="text" id="reg-raza" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="Ej. Golden Retriever">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                        <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="tucorreo@dominio.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
                        <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="Mínimo 6 caracteres">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-gradient-to-r from-mint-500 to-mint-400 hover:from-mint-400 hover:to-mint-300 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-mint-500/20 transition-all flex items-center justify-center space-x-2">
                        <span>Registrar a mi Perro</span>
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Contenedor principal de la app -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Aquí se cargará dinámicamente el muro y perfil una vez autenticado -->
    </div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
