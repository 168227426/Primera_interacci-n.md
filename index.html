<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotodog - La Red Social Canina Exclusiva</title>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#3b0764',
                            950: '#1e0038',
                        },
                        mint: {
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-100 antialiased bg-slate-950">

    <!-- ==================== MODAL DE AUTENTICACIÓN ==================== -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-xl p-4 overflow-y-auto">
        <div class="bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-brand-500/30 p-8 text-center relative">
            <div class="inline-flex p-4 bg-brand-500/10 rounded-3xl mb-3 border border-brand-500/30">
                <i data-lucide="dog" class="w-12 h-12 text-mint-400"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">Fotodog</h1>
            <p class="text-slate-400 text-sm mb-6">La red social canina exclusiva de publicaciones diarias</p>

            <!-- Pestañas -->
            <div class="flex bg-slate-950 p-1.5 rounded-2xl mb-6 border border-slate-800">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl bg-brand-600 text-white shadow-lg transition-all">Iniciar Sesión</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl text-slate-400 hover:text-white transition-all">Registrarse</button>
            </div>

            <!-- Login -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="tucorreo@dominio.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full mt-2 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition-all">Entrar a la Jauría</button>
            </form>

            <!-- Registro -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 text-left hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre del Perro</label>
                    <input type="text" id="reg-nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="Ej. Firulais">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Username (@)</label>
                    <input type="text" id="reg-username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="@firulais">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Raza</label>
                    <input type="text" id="reg-raza" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="Ej. Beagle">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="tucorreo@dominio.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full mt-2 bg-mint-500 hover:bg-mint-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition-all">Registrar a mi Perro</button>
            </form>
        </div>
    </div>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <div class="flex-1 flex flex-col max-w-2xl w-full mx-auto p-4 space-y-6">
        <!-- Header -->
        <header class="flex items-center justify-between bg-slate-900/80 p-4 rounded-3xl border border-slate-800">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-600 rounded-2xl"><i data-lucide="dog" class="w-6 h-6 text-white"></i></div>
                <div>
                    <h1 class="font-black text-lg text-white">FOTODOG</h1>
                    <span id="header-username" class="text-xs text-mint-400 font-semibold">@perrito</span>
                </div>
            </div>
            <button onclick="logout()" class="px-4 py-2 bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-xs font-bold rounded-xl transition-all">Cerrar Sesión</button>
        </header>

        <!-- Panel de Carga de Foto Diaria -->
        <div class="bg-slate-900/80 p-5 rounded-3xl border border-slate-800 space-y-3">
            <div class="flex justify-between text-xs font-bold text-slate-400">
                <span>Límite diario:</span>
                <span class="text-mint-400"><span id="daily-count-num">0</span> / 2 fotos hoy</span>
            </div>
            <div id="upload-box" class="space-y-3">
                <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewSelectedImage(event)">
                <button onclick="document.getElementById('photo-input').click()" class="w-full py-3 bg-slate-950 border border-dashed border-brand-500/50 hover:border-mint-400 text-xs font-bold rounded-xl transition-all">Seleccionar Imagen</button>
                <textarea id="photo-caption" rows="2" placeholder="Escribe algo sobre tu perrito hoy..." class="w-full bg-slate-950 border border-slate-800 p-3 text-xs rounded-xl focus:outline-none focus:border-brand-500 text-white"></textarea>
                <button onclick="uploadDailyPhoto()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-xs font-bold rounded-xl text-white transition-all">Publicar en el Muro</button>
            </div>
            <div id="upload-blocked-msg" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-400 text-xs font-bold text-center">
                🔒 ¡Has alcanzado el límite de 2 fotos por hoy!
            </div>
        </div>

        <!-- Muro de Publicaciones -->
        <div id="muro-feed" class="space-y-6">
            <!-- Carga dinámica -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
